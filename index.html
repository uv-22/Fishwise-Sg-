<!DOCTYPE html>
<html lang="en" class="is-booting">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FishWise SG</title>
<meta name="description" content="Singapore's angling companion: every legal spot with directions and a 3D view, real fish photos, live NEA weather maps, lessons, a gear advisor and community." />
<meta name="theme-color" content="#04070D" />
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
<style>
  /* ---------- Boot screen (inline so it paints on the first frame) ---------- */
  html { background: #02040A; }
  #boot {
    --p: 0;
    position: fixed; inset: 0; z-index: 1000; overflow: hidden; background: #02040A; color: #F2F6FC; cursor: default;
    font-family: "Manrope", -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: opacity .9s ease .25s, visibility 0s 1.2s;
  }
  #boot.is-out { opacity: 0; visibility: hidden; pointer-events: none; }
  #boot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #boot-scene { animation: bFade 1.4s ease .1s both; transition: transform 1.3s cubic-bezier(.6, 0, .2, 1), filter 1s ease; transform-origin: 50% 40%; }
  #boot.is-out #boot-scene { transform: scale(1.18) translateY(4%); filter: blur(6px); }
  #boot-field { z-index: 1; mix-blend-mode: screen; }
  #boot .b-vig { position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(46% 34% at 50% 60%, rgba(2, 4, 10, .78) 0%, rgba(2, 4, 10, .35) 60%, rgba(2, 4, 10, 0) 100%),
                linear-gradient(180deg, rgba(2, 4, 10, .25), rgba(2, 4, 10, 0) 20%, rgba(2, 4, 10, 0) 80%, rgba(2, 4, 10, .6)); }
  #boot .b-top { position: absolute; z-index: 3; top: 1.3rem; left: 1.6rem; right: 1.6rem; display: flex; justify-content: space-between; align-items: center;
    font: 500 .68rem/1 "JetBrains Mono", ui-monospace, Consolas, monospace; letter-spacing: .16em; text-transform: uppercase; color: #8FA0BA; animation: bFade 1s ease .3s both; }
  #boot .b-top b { font: 700 1.05rem/1 "Sora", "Manrope", sans-serif; letter-spacing: -0.03em; text-transform: none; color: #F2F6FC; }
  #boot .b-top b span { color: #7CC4FF; margin-left: .2em; }
  #boot .b-core { position: absolute; z-index: 3; left: 0; right: 0; top: 50%; display: grid; justify-items: center; text-align: center; padding: 0 1.25rem;
    transition: transform .8s cubic-bezier(.6, 0, .3, 1), opacity .5s ease, filter .6s ease; }
  #boot.is-out .b-core { transform: translateY(-30px) scale(.96); opacity: 0; filter: blur(10px); }
  #boot .b-kick { font: 500 .7rem/1 "JetBrains Mono", ui-monospace, Consolas, monospace; letter-spacing: .22em; text-transform: uppercase; color: #7CC4FF;
    display: inline-flex; align-items: center; gap: .7rem; animation: bRise .9s cubic-bezier(.16, 1, .3, 1) .5s both; }
  #boot .b-kick::before, #boot .b-kick::after { content: ""; width: 26px; height: 1px; background: currentColor; opacity: .6; }
  #boot .b-word { margin: .9rem 0 0; font: 800 clamp(3rem, 10.5vw, 7.6rem)/.92 "Sora", "Manrope", sans-serif; letter-spacing: -0.06em; white-space: nowrap; }
  #boot .b-word span { display: inline-block; animation: bLetter 1.1s cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(.65s + var(--i) * 55ms); }
  #boot .b-word .sg { color: transparent; background: linear-gradient(180deg, #A8D8FF, #4FA3FF); -webkit-background-clip: text; background-clip: text; margin-left: .12em; }
  #boot .b-tag { margin: 1.1rem 0 0; font-size: clamp(1rem, 2vw, 1.2rem); color: #C5D1E3; max-width: 38ch; animation: bRise 1s cubic-bezier(.16, 1, .3, 1) 1.3s both; }
  #boot .b-tag em { font-style: normal; color: #7CC4FF; }
  #boot .b-load { display: grid; grid-template-columns: auto 1fr auto; gap: .9rem; align-items: center; width: min(420px, 82vw); margin-top: 2rem; animation: bRise .9s ease 1.6s both; }
  #boot .b-bar { position: relative; height: 2px; background: rgba(124, 196, 255, .16); border-radius: 2px; overflow: hidden; }
  #boot .b-bar i { position: absolute; inset: 0; background: linear-gradient(90deg, #2B7FE8, #7CC4FF); transform-origin: left; transform: scaleX(var(--p)); transition: transform .3s ease-out; box-shadow: 0 0 10px #7CC4FF; }
  #boot .b-pct { font: 600 .78rem/1 "JetBrains Mono", ui-monospace, Consolas, monospace; color: #F2F6FC; min-width: 2ch; }
  #boot .b-pct::after { content: "%"; color: #5F7090; }
  #boot .b-status { font: 500 .72rem/1 "JetBrains Mono", ui-monospace, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; color: #8FA0BA; text-align: right; min-width: 15ch; }
  #boot .b-chips { display: flex; gap: .45rem; flex-wrap: wrap; justify-content: center; margin-top: 1.4rem; animation: bRise .9s ease 1.9s both; }
  #boot .b-chips span { font: 500 .66rem/1 "JetBrains Mono", ui-monospace, Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; color: #C5D1E3;
    padding: .42rem .7rem; border-radius: 999px; border: 1px solid rgba(124, 196, 255, .22); background: rgba(4, 7, 13, .45); }
  #boot .b-chips b { color: #7CC4FF; font-weight: 600; }
  #boot .b-skip { position: absolute; z-index: 3; bottom: 1.3rem; right: 1.6rem; font: 500 .68rem/1 "JetBrains Mono", ui-monospace, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase;
    color: #8FA0BA; background: rgba(4, 7, 13, .5); border: 1px solid rgba(124, 196, 255, .2); border-radius: 999px; padding: .55rem .9rem; cursor: pointer; animation: bFade 1s ease 2.4s both; }
  #boot .b-skip:hover { color: #F2F6FC; border-color: #7CC4FF; }
  #boot .b-hint { position: absolute; z-index: 3; bottom: 1.45rem; left: 1.6rem; font: 500 .66rem/1 "JetBrains Mono", ui-monospace, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; color: #5F7090; animation: bFade 1s ease 2.6s both; }
  #boot.is-quick *, #boot.is-quick #boot-scene { animation-delay: 0s !important; animation-duration: .6s !important; }
  #boot.is-quick .b-hint, #boot.is-quick .b-chips { display: none; }
  @keyframes bFade { from { opacity: 0; } }
  @keyframes bRise { from { opacity: 0; transform: translateY(22px); filter: blur(8px); } }
  @keyframes bLetter { from { opacity: 0; transform: translateY(60%) rotate(6deg); filter: blur(10px); } }
  @media (max-width: 640px) {
    #boot .b-core { top: 44%; }
    #boot .b-hint, #boot .b-top > span { display: none; }
    #boot .b-status { min-width: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #boot *, #boot { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .2s !important; }
  }
</style>
<link rel="stylesheet" href="src/styles.css" />
<link rel="stylesheet" href="src/platform.css" />
<link rel="stylesheet" href="src/learn.css" />
<link rel="stylesheet" href="src/theme.css" />
<script>
  // If a local stylesheet drops mid-load (flaky dev servers), fetch it again.
  window.addEventListener('load', function () {
    document.querySelectorAll('link[rel="stylesheet"][href^="src/"]').forEach(function (l) {
      var ok = false;
      try { ok = !!(l.sheet && l.sheet.cssRules.length); } catch (e) { ok = true; }
      if (!ok) {
        var n = l.cloneNode();
        n.href = l.getAttribute('href').split('?')[0] + '?r=' + Date.now();
        l.after(n);
        n.onload = function () { l.remove(); };
      }
    });
  });
</script>

<body>
  <div id="boot" role="status" aria-label="Loading FishWise SG">
    <canvas id="boot-scene" aria-hidden="true"></canvas>
    <canvas id="boot-field" aria-hidden="true"></canvas>
    <div class="b-vig" aria-hidden="true"></div>
    <div class="b-top" aria-hidden="true"><b>FishWise<span>SG</span></b><span>Singapore · 1.35°N 103.82°E</span></div>
    <div class="b-core" aria-hidden="true">
      <span class="b-kick">Singapore's angling companion</span>
      <p class="b-word"><span style="--i:0">F</span><span style="--i:1">i</span><span style="--i:2">s</span><span style="--i:3">h</span><span style="--i:4">W</span><span style="--i:5">i</span><span style="--i:6">s</span><span style="--i:7">e</span><span class="sg" style="--i:9">SG</span></p>
      <p class="b-tag">Every legal jetty and reservoir, <em>real fish</em>, live weather and the know-how to fish them well.</p>
      <div class="b-load"><span class="b-pct" id="boot-pct">00</span><span class="b-bar"><i></i></span><span class="b-status" id="boot-status">Waking the water</span></div>
      <div class="b-chips"><span><b>43</b> spots</span><span><b>12</b> species</span><span><b>22</b> lessons</span><span><b>Live</b> NEA weather</span></div>
    </div>
    <span class="b-hint" aria-hidden="true">Move your cursor through the water</span>
    <button class="b-skip" type="button" id="boot-skip">Skip intro</button>
  </div>
  <script src="src/boot.js"></script>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
  <noscript>
    <style>#boot { display: none; } html.is-booting body { overflow: auto; }</style>
    <div class="noscript">FishWise SG is an interactive prototype and needs JavaScript enabled.</div>
  </noscript>
  <script type="module" src="src/app.js"></script>
</body>
